name: Update schemes.csv from AMFI NAVAll

on:
  schedule:
    # Run every two weeks (1st and 15th of each month at 03:00 UTC ≈ 08:30 IST)
    - cron: "0 3 1,15 * *"
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  update-schemes:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Download & parse NAVAll.txt
        run: |
          python update_schemes.py --output schemes.csv

      - name: Commit updated schemes.csv if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schemes.csv
          if git diff --staged --quiet; then
            echo "No changes to schemes.csv"
          else
            git commit -m "chore: update schemes.csv from AMFI NAVAll ($(date -u +%Y-%m-%d))"
            git push
          fi
